name: Update scanner data

on:
  schedule:
    - cron: "*/15 3-10 * * 1-5"  # every 15 minutes, 08:30 to 16:15 IST (GitHub may start a run a few minutes late)
    - cron: "0 14 * * 1-5"       # 19:30 IST, once Yahoo has filled the day's close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data.json
        run: python3 scripts/build_data.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update scanner data"
          git push
