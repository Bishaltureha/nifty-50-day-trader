name: Update scanner data

# GitHub's own cron is unreliable (scheduled runs can be skipped for hours), so
# one run stays up and rebuilds data.json every 15 minutes itself: 08:30 to 16:15
# IST and once at 19:45 IST (after Yahoo fills the day's close), weekdays. Just
# before the 6-hour job limit it starts the next run, so it never stops.
# The daily cron below only restarts the chain if it ever breaks.

on:
  schedule:
    - cron: "41 2 * * 1-5"   # 08:11 IST: restart the chain if it has stopped
  push:
    branches: [main]
    paths: [".github/workflows/update-data.yml", "scripts/**", "scanner/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild data.json every 15 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          start=$(date +%s)
          limit=$((5 * 3600 + 35 * 60))
          while :; do
            dow=$(TZ=Asia/Kolkata date +%u)
            hm=$((10#$(TZ=Asia/Kolkata date +%H%M)))
            if [[ $dow -le 5 ]] && { [[ $hm -ge 830 && $hm -le 1615 ]] || [[ $hm -ge 1945 && $hm -lt 2000 ]]; }; then
              echo "== $(TZ=Asia/Kolkata date '+%F %H:%M') IST: building"
              git pull -q --rebase || git rebase --abort || true
              if python3 scripts/build_data.py; then
                if git diff --quiet -- data.json; then
                  echo "data.json unchanged"
                else
                  git add data.json
                  git commit -q -m "Update scanner data"
                  git push -q || { git pull -q --rebase -X theirs && git push -q; } || echo "push failed, next round"
                fi
              else
                echo "build failed, next round"
                git checkout -- data.json 2>/dev/null || true
              fi
            fi
            now=$(date +%s)
            if (( now - start > limit )); then
              echo "Near the 6-hour limit: starting the next run."
              gh workflow run update-data.yml --ref main
              exit 0
            fi
            # wake 1 minute after the next quarter hour (IST quarters line up with UTC ones)
            sleep $(( 900 - now % 900 + 60 ))
          done
