name: Update scanner data

# GitHub's own cron is unreliable (scheduled runs can be skipped for hours), so
# one run stays up and rebuilds data.json every 15 minutes itself: 08:30 to 16:15
# IST and once at 19:45 IST (after Yahoo fills the day's close), weekdays. Just
# before the 6-hour job limit it starts the next run, so it never stops.
# The daily cron below only restarts the chain if it ever breaks.

on:
  schedule:
    - cron: "41 2 * * 1-5"   # 08:11 IST: restart the chain if it has stopped
  push:
    branches: [main]
    paths: [".github/workflows/update-data.yml", "scripts/**", "scanner/**"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data-v2
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild data.json every 15 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          start=$(date +%s)
          limit=$((5 * 3600 + 35 * 60))
          while :; do
            dow=$(TZ=Asia/Kolkata date +%u)
            hm=$((10#$(TZ=Asia/Kolkata date +%H%M)))
            if [[ $dow -le 5 ]] && { [[ $hm -ge 830 && $hm -le 1615 ]] || [[ $hm -ge 1945 && $hm -lt 2000 ]]; }; then
              echo "== $(TZ=Asia/Kolkata date '+%F %H:%M') IST: building"
              git pull -q --rebase || git rebase --abort || true
              if python3 scripts/build_data.py; then
                python3 scripts/build_signals.py || echo "signals build failed, keeping the last signals.json"
                if git diff --quiet -- data.json signals.json; then
                  echo "data.json unchanged"
                else
                  git add data.json signals.json
                  git commit -q -m "Update scanner data"
                  git push -q || { git pull -q --rebase -X theirs && git push -q; } || echo "push failed, next round"
                fi
              else
                echo "build failed, next round"
                git checkout -- data.json 2>/dev/null || true
              fi
            fi
            now=$(date +%s)
            if (( now - start > limit )); then
              echo "Near the 6-hour limit: starting the next run."
              gh workflow run update-data.yml --ref main
              exit 0
            fi
            # wake 1 minute after the next quarter hour (IST quarters line up with UTC ones)
            sleep $(( 900 - now % 900 + 60 ))
          done

  # Every minute in market hours: the latest price of each share -> live.json on the
  # `live` branch (one commit, force-pushed, so history stays small and Pages does not
  # rebuild). The site reads it through the GitHub API and updates prices each minute.
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write live.json every minute
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/live"
          start=$(date +%s)
          limit=$((5 * 3600 + 35 * 60))
          while (( $(date +%s) - start < limit )); do
            dow=$(TZ=Asia/Kolkata date +%u)
            hm=$((10#$(TZ=Asia/Kolkata date +%H%M)))
            if [[ $dow -le 5 && $hm -ge 914 && $hm -le 1535 ]]; then
              rm -rf "$out" && mkdir -p "$out"
              if python3 scripts/build_live.py "$out/live.json"; then
                # B / S signals on Nifty 5-minute candles ride along with the live prices
                python3 scripts/build_signals.py "$out/signals.json" || echo "signals build failed this minute"
                (cd "$out" && git init -q -b live \
                  && git config user.name "github-actions[bot]" \
                  && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" \
                  && git add live.json && { [ ! -f signals.json ] || git add signals.json; } \
                  && git commit -q -m "Live prices" \
                  && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" live) \
                  || echo "push failed, next minute"
              fi
            fi
            now=$(date +%s)
            sleep $(( 60 - now % 60 + 5 ))
          done
